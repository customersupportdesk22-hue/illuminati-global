<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login | Illuminati Global</title><link rel="stylesheet" href="/style.css"></head><body class="form-page"><main class="form-card"><a class="brand centered" href="/"><span class="brand-mark">◉</span><span>ILLUMINATI GLOBAL</span></a><p class="eyebrow center">MEMBER ACCESS</p><h1>Welcome back</h1><p class="muted center">Sign in to your member account.</p><form id="loginForm"><label>Email address<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button full" type="submit">LOG IN SECURELY</button></form><p id="message" class="message" role="status"></p><p class="muted center">New here? <a href="/register.html">Create a free account</a></p></main><script>const form=document.getElementById('loginForm');if(new URLSearchParams(location.search).has('registered'))document.getElementById('message').textContent='Registration successful. You can now log in.';form.addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message'),btn=form.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw Error(d.message);location.href=d.redirect;}catch(err){msg.textContent=err.message||'Login failed.';}finally{btn.disabled=false;}});</script></body></html>
