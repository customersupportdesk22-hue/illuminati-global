<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Member Dashboard | Illuminati Global</title><link rel="stylesheet" href="/style.css"></head>
<body class="form-page">
<main class="form-card wide-card">
  <a class="brand centered" href="/">◉ <span>ILLUMINATI GLOBAL</span></a>
  <div class="symbol small-symbol" aria-hidden="true">𓂀</div>
  <h1>Member dashboard</h1>
  <p id="welcome" class="muted">Loading your account…</p>
  <div id="profile" class="profile"></div>
  <button class="button full" id="logout">LOG OUT</button>
</main>
<script>
const safe = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async () => {
  try {
    const response = await fetch("/api/me");
    if (!response.ok) { location.href="/login.html"; return; }
    const m = await response.json();
    document.getElementById("welcome").textContent = `Welcome, ${m.name}`;
    document.getElementById("profile").innerHTML = `
      <p><span>Full name</span>${safe(m.name)}</p>
      <p><span>Email</span>${safe(m.email)}</p>
      <p><span>Phone</span>${safe(m.phone)}</p>
      <p><span>Country</span>${safe(m.country)}</p>
      <p><span>Membership</span>Free community member</p>
      <p><span>Joined</span>${new Date(m.createdAt).toLocaleDateString()}</p>`;
  } catch { document.getElementById("welcome").textContent = "Could not load your profile."; }
})();
document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/api/logout", {method:"POST"}); location.href="/";
});
</script>
</body></html>
